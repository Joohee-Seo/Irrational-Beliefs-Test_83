<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1단계: 비합리적 신념 검사</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --primary: #4f46e5; --bg: #f8fafc; --card-bg: #fff; --text: #1e293b; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
    .container { max-width: 760px; margin: 0 auto; }
    header { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; }
    .badge { background: var(--primary); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .scale-guide { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; font-size: 0.75rem; text-align: center; }
    .scale-guide div { background: #f1f5f9; padding: 6px 2px; border-radius: 6px; font-weight: 600; }
    .test-auto-btn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; padding: 8px; border-radius: 6px; font-size: 0.82rem; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
    .question-card { background: #fff; padding: 14px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
    .q-title { font-size: 0.92rem; font-weight: 600; margin-bottom: 10px; }
    .options { display: flex; gap: 4px; }
    .opt-btn { flex: 1; text-align: center; padding: 10px 2px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.8rem; cursor: pointer; user-select: none; }
    .opt-btn.checked { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: bold; }
    .btn-main { background: var(--primary); color: #fff; border: none; padding: 14px 20px; font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; margin: 16px 0; }
    #result-area { display: none; background: #fff; padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-top: 20px; }
    .chart-box { max-width: 480px; margin: 16px auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 0.82rem; }
    th, td { border: 1px solid var(--border); padding: 8px 4px; text-align: center; }
    th { background: #f8fafc; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <span class="badge">1단계: 진단</span>
    <h1 style="font-size: 1.25rem; margin: 8px 0 4px;">비합리적 신념 검사 (83문항)</h1>
    <p style="font-size: 0.85rem; color: #64748b;">평소 자신의 생각과 가장 가까운 번호를 선택해주세요.</p>
    <div class="scale-guide">
      <div>1.전혀아님</div><div>2.아닌편</div><div>3.보통</div><div>4.그런편</div><div>5.매우그럼</div>
    </div>
    <button type="button" class="test-auto-btn" onclick="quickFillForTesting()">⚡ [빠른 테스트] 83문항 자동 채우기</button>
  </header>

  <div id="survey-list"></div>
  <button class="btn-main" onclick="finishSurvey()">검사 제출 및 결과 확인</button>

  <section id="result-area">
    <h2 style="font-size:1.2rem; text-align:center;">신념 프로파일 분석 결과</h2>
    <div class="chart-box"><canvas id="radarChart"></canvas></div>
    <table id="score-table">
      <thead><tr><th>영역</th><th>문항수</th><th>평균점수</th><th>상태</th></tr></thead>
      <tbody></tbody>
    </table>
    <div style="background:#eef2ff; border-radius:8px; padding:12px; margin-top:14px;">
      <strong style="color:var(--primary);">💡 치유 타깃:</strong>
      <p style="font-size:0.88rem; margin-top:4px;" id="highest-alert-text"></p>
    </div>
    <button class="btn-main" style="background:#059669;" onclick="goToGeosa()">2단계: 거사(居邪) 치유 세션으로 이동하기 ➔</button>
  </section>
</div>

<script>

  { id: 10, text: "나는 다른 사람들로부터 존중받는 것을 좋아하지만, 반드시 그래야할 필요는 없다.", isRev: true },
  { id: 11, text: "나는 내가 잘 할 수 없는 일은 피해 버린다.", isRev: false },
  { id: 12, text: "너무나 많은 나쁜 사람들이 그들이 받아야 할 벌을 피하고 있다.", isRev: false },

  { id: 21, text: "나는 종종 걱정거리가 있으면 마음이 거기서 떠나지 않는다.", isRev: false },

  { id: 26, text: "도덕적이지 못한 것은 강력히 처벌받아야 한다.", isRev: false },
  { id: 27, text: "나는 내가 좋아하지 않는 상황에 있을 때 종종 괴로움을 느낀다.", isRev: false },
  { id: 28, text: "나는 대개 가능한 빨리 결정을 내린다.", isRev: true },
  { id: 29, text: "나에게는 내가 매우 의존하는 사람들이 있다.", isRev: false },
  { id: 30, text: "다른 사람이 나를 싫어한다면, 그것은 나의 문제가 아니라 그들의 문제이다.", isRev: true },
  { id: 31, text: "나는 내가 하는 모든 일에 성공하는 것이 아주 중요하다.", isRev: false },
  { id: 32, text: "나는 다른 사람의 나쁜 행위 때문에 그 사람을 비난하지는 않는다.", isRev: true },
  { id: 33, text: "나는 대개 내가 싫어하는 것들에 대해서도 그것들의 모습 그대로를 인정한다.", isRev: true },
  { id: 34, text: "나는 내가 좋아하지 않는 상황에 있을 때 종종 괴롭다.", isRev: false },
  { id: 35, text: "맘에 내키지 않는 일을 하면서 시간을 보내기엔 인생이 너무 짧다.", isRev: false },

  { id: 44, text: "내 문제를 진정으로 이해하고 직면할 수 있는 사람은 나 자신밖에 없다.", isRev: true },
  { id: 45, text: "과거의 경험이 지금 나에게 영향을 주고 있다고 생각하지 않는다.", isRev: true },
  { id: 46, text: "나는 남에게 인정받는 것을 좋아하지만, 그것이 나의 진정한 욕구는 아니다.", isRev: true },
  { id: 47, text: "어떤 일에서 나보다 다른 사람이 더 낫다는 사실이 나를 괴롭힌다.", isRev: false },
  { id: 48, text: "모든 사람은 기본적으로 선하다.", isRev: true },
  { id: 49, text: "나는 원하는 것을 얻기 위하여 어떤 일을 하고 그런 후에는 그 일에 대해서 걱정하지 않는다.", isRev: true },
  { id: 50, text: "아무것도 그 자체만으로 당황하게 되지는 않는다. 단지 자신이 그것을 어떻게 해석하느냐에 달려 있다.", isRev: true },
  { id: 51, text: "나는 미래에 일어날 어떤 일에 대해 많은 걱정을 한다.", isRev: false },
  { id: 52, text: "나는 내키지 않는 하찮은 일을 하기가 어렵다.", isRev: false },
  { id: 53, text: "나는 다른 사람이 내 일에 대해 결정내려 주는 것을 싫어한다.", isRev: true },
  { id: 54, text: "우리는 저마다 개인의 과거사에 얽매여 있다.", isRev: false },
  { id: 55, text: "어떤 일에 대한 이상적인 해결책은 드물다.", isRev: true },
  { id: 56, text: "나는 종종 얼마나 많은 사람이 나를 인정하고 수용해 줄 것인가에 대해 걱정한다.", isRev: false },
  { id: 57, text: "실수를 하면 나는 당황스럽다.", isRev: false },
  { id: 58, text: "선한 사람과 악한 사람 모두에게 똑같은 일이 닥친다는 것은 부당하다.", isRev: false },
  { id: 59, text: "나는 인생을 아주 쉽게 살아간다.", isRev: true },
  { id: 60, text: "보다 많은 사람들이 달갑지 않은 일일지라도 부딪쳐 헤쳐 나가야 한다.", isRev: true },
  { id: 61, text: "나는 남에게 조언을 구하는 것이 쉽다고 생각한다.", isRev: false },
  { id: 62, text: "일단 어떤 것이 당신의 인생에 강력한 영향을 미친다면, 그것은 계속해서 그럴 것이다.", isRev: false },
  { id: 63, text: "완벽한 해결책보다 실용적인 해결책을 찾는 것이 더 낫다.", isRev: true },
  { id: 64, text: "나는 사람들이 나에 대해 어떻게 느끼는가에 상당한 관심이 있다.", isRev: false },
  { id: 65, text: "나는 종종 사소한 일에 대해서도 매우 성이 난다.", isRev: false },
  { id: 66, text: "나는 대개 나에게 잘못한 사람에게 다시 한 번 더 기회를 준다.", isRev: true },
  { id: 67, text: "나는 책임지는 것을 싫어한다.", isRev: false },
  { id: 68, text: "아주 오랫동안 슬픔에 잠겨 있을 하등의 이유가 없다.", isRev: true },
  { id: 69, text: "나는 죽음이나 핵전쟁과 같은 문제에 대해 별로 생각하지 않는다.", isRev: true },
  { id: 70, text: "사람들은 극복해야 할 문제가 있고, 그것에 대해 도전을 할 때 가장 행복하다.", isRev: false },
  { id: 71, text: "나는 다른 사람에게 의존하는 것을 싫어한다.", isRev: true },
  { id: 72, text: "사람들은 결코 근본적으로 변화할 수 없다.", isRev: false },
  { id: 73, text: "나는 원칙대로 일을 다뤄야 한다고 생각한다.", isRev: false },
  { id: 74, text: "비판받는 것은 싫긴 하지만 그것 때문에 당혹스럽지는 않다.", isRev: true },
  { id: 75, text: "나는 내가 잘 해낼 수 없는 일을 한다고 해서 두렵지 않다.", isRev: true },

const subscales = [
  { name: "인정 욕구", items: [1, 10, 19, 24, 30, 46, 56, 64, 74] },
  { name: "개인적 완벽성", items: [2, 11, 20, 25, 31, 39, 47, 57, 65, 75] },
  { name: "비난 경향성", items: [3, 12, 26, 32, 48, 58, 66, 76] },
  { name: "파국화", items: [4, 13, 27, 33, 49, 59, 67, 77] },
  { name: "정서적 무책임감", items: [5, 14, 41, 50, 60, 68, 78] },
  { name: "과잉불안염려", items: [6, 15, 21, 34, 42, 51, 69, 79] },
  { name: "문제 회피", items: [7, 22, 28, 35, 43, 52, 70, 80] },
  { name: "의존성", items: [16, 23, 29, 36, 44, 53, 61, 71, 81] },
  { name: "무기력", items: [8, 17, 37, 45, 54, 62, 72, 82] },
  { name: "완벽한 해결", items: [9, 18, 38, 55, 63, 73, 83] }
];

const surveyList = document.getElementById('survey-list');
questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = `q-${q.id}`;
  let opts = '';
  for(let v=1; v<=5; v++) {
    opts += `<div class="opt-btn" id="opt-${q.id}-${v}" onclick="chooseOption(${q.id}, ${v})">${v}</div>`;
  }
  card.innerHTML = `<div class="q-title">${q.id}. ${q.text}</div><div class="options">${opts}</div>`;
  surveyList.appendChild(card);
});

const userAnswers = {};
function chooseOption(qId, val) {
  userAnswers[qId] = val;
  for(let v=1; v<=5; v++) {
    const el = document.getElementById(`opt-${qId}-${v}`);
    if(el) el.classList.remove('checked');
  }
  document.getElementById(`opt-${qId}-${val}`).classList.add('checked');
}

function quickFillForTesting() {
  questions.forEach(q => {
    const rand = Math.floor(Math.random() * 5) + 1;
    chooseOption(q.id, rand);
  });
  alert('83문항이 모두 채워졌습니다. 맨 아래 [검사 제출 및 결과 확인]을 눌러주세요.');
}

let topBelief = { name: "개인적 완벽성", avg: 4.2 };
let radarChartInstance = null;

function finishSurvey() {
  const unans = [];
  questions.forEach(q => { if(!userAnswers[q.id]) unans.push(q.id); });
  if(unans.length > 0) {
    alert(`미응답 문항이 있습니다: ${unans.slice(0, 5).join(', ')}${unans.length > 5 ? ' 외' : ''}번을 체크해주세요.`);
    document.getElementById(`q-${unans[0]}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const labels = [], avgs = [];
  const tbody = document.querySelector('#score-table tbody');
  tbody.innerHTML = '';
  let highest = { name: '', avg: -1 };

  subscales.forEach(sub => {
    let sum = 0;
    sub.items.forEach(qid => {
      const q = questions.find(x => x.id === qid);
      let val = userAnswers[qid];
      if(q.isRev) val = 6 - val;
      sum += val;
    });
    const avg = parseFloat((sum / sub.items.length).toFixed(2));
    labels.push(sub.name);
    avgs.push(avg);

    if(avg > highest.avg) { highest = { name: sub.name, avg: avg }; }

    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${sub.name}</td><td>${sub.items.length}</td><td>${avg}</td><td>${avg>=3.5 ? '🔴 높음' : '🟢 양호'}</td>`;
    tbody.appendChild(tr);
  });

  topBelief = highest;
  localStorage.setItem('topBeliefName', topBelief.name);
  localStorage.setItem('topBeliefAvg', topBelief.avg);

  document.getElementById('highest-alert-text').innerHTML = 
    `현재 가장 두드러진 영역은 <strong>[${topBelief.name}]</strong> (평균 ${topBelief.avg}점)입니다.`;

  document.getElementById('result-area').style.display = 'block';
  document.getElementById('result-area').scrollIntoView({ behavior: 'smooth' });

  const ctx = document.getElementById('radarChart').getContext('2d');
  if(radarChartInstance) radarChartInstance.destroy();
  radarChartInstance = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: labels,
      datasets: [{
        label: '신념 점수 (1~5점)',
        data: avgs,
        fill: true,
        backgroundColor: 'rgba(79, 70, 229, 0.2)',
        borderColor: 'rgb(79, 70, 229)',
        pointBackgroundColor: 'rgb(79, 70, 229)'
      }]
    },
    options: { scales: { r: { min: 1, max: 5, ticks: { stepSize: 1 } } } }
  });
}

function goToGeosa() {
  window.location.href = "geosa.html";
}
</script>
</body>
</html>
