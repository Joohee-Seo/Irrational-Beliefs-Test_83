<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2단계: 거사(居邪) 치유 세션</title>
  <style>
    :root { --primary: #059669; --bg: #f8fafc; --card-bg: #fff; --text: #1e293b; --border: #e2e8f0; --bot-bg: #f1f5f9; --user-bg: #059669; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #fff; padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .badge { background: var(--primary); color: #fff; padding: 3px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: bold; }
    .chat-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; max-width: 760px; margin: 0 auto; width: 100%; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg-wrap { display: flex; width: 100%; }
    .msg-wrap.bot { justify-content: flex-start; }
    .msg-wrap.user { justify-content: flex-end; }
    .msg-box { max-width: 85%; padding: 12px 14px; border-radius: 14px; font-size: 0.92rem; line-height: 1.55; white-space: pre-wrap; }
    .msg-wrap.bot .msg-box { background: var(--bot-bg); color: #0f172a; border-bottom-left-radius: 3px; border: 1px solid var(--border); }
    .msg-wrap.user .msg-box { background: var(--user-bg); color: #fff; border-bottom-right-radius: 3px; }
    .chat-input-bar { border-top: 1px solid var(--border); padding: 10px; display: flex; gap: 8px; background: #fff; }
    textarea { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.95rem; resize: none; height: 42px; outline: none; }
    .send-btn { background: var(--primary); color: #fff; border: none; width: 44px; height: 42px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
    .report-card { background: #f0fdf4; border: 1.5px solid #bbf7d0; border-radius: 10px; padding: 14px; margin-top: 10px; font-size: 0.88rem; }
    .btn-main { background: #4f46e5; color: #fff; border: none; padding: 12px 20px; font-size: 0.95rem; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <span class="badge">2단계: 거사(居邪)</span>
      <strong style="margin-left: 6px; font-size: 0.95rem;" id="header-title">마음침 거사 챗봇</strong>
    </div>
  </header>

  <div class="chat-view">
    <div class="chat-messages" id="chat-box"></div>
    <div class="chat-input-bar">
      <textarea id="chat-input" placeholder="답변을 입력하세요..." onkeydown="handleKeyDown(event)"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

<script>
const topBeliefName = localStorage.getItem('topBeliefName') || '개인적 완벽성';
document.getElementById('header-title').innerText = `타깃 신념: [${topBeliefName}]`;

const geosaFlow = [
  { step: 1, prompt: `안녕하세요. 검사에서 확인된 [${topBeliefName}] 신념을 마주하고 편안하게 흘려보내는 거사(居邪) 여정입니다.\n\n이 신념을 본인만의 평소 말투로 표현한다면 어떤 문장인가요?\n(예: "실패하면 낙오자다", "모두에게 인정받아야 한다")` },
  { step: 2, prompt: `그 신념과 불편한 감정이 올라왔던 '최근의 유발사건'은 무엇이었나요?\n그때 가슴/배 등 몸의 감각과, 떠오르는 이미지(취상)를 알려주세요. (불편감 점수: 0~10점)` },
  { step: 3, prompt: `과거에도 이와 비슷하게 '심란함이나 두려움'을 강하게 느꼈던 핵심 기억이나 장면(원발사건)이 떠오르시나요?\n지금 그 기억을 떠올릴 때 몸의 느낌과 이미지(취상: 예: 검은 돌 등)는 어떤가요? (불편감 점수: 0~10점)` },
  { step: 4, prompt: `그 원발사건을 겪었을 당시, 어린(과거의) 나는 그 상황을 어떻게 해석하고 받아들였나요?\n(예: "내가 실패하면 다들 나를 버리고 떠날 것이다")` },
  { step: 5, prompt: `그 해석을 마음에 품고 살다 보니, 내 미래나 인간관계에서 어떤 끔찍한 일(두려운 미래상)이 벌어질 것 같았나요?` },
  { step: 6, prompt: `그런 불행한 일이 생기지 않도록 막기 위해, 나는 평소 삶에서 어떤 태도로 애써왔나요?\n그리고 그런 나 자신을 비유(취상)한다면 어떤 모습인가요? (예: 바스라질 것 같은 낙엽 등)` },
  { step: 7, prompt: `나를 그렇게 몰아붙여 온 그 마음은, 실은 나를 무엇으로부터 지키고 보호하려 했던 걸까요? (선의적 의도)\n궁극적으로 정말 누리고 싶었던 감정(이차적 이익: 사랑, 안전감 등)은 무엇인가요?` },
  { step: 8, prompt: `나를 지키려 애써온 그 마음을 따뜻하게 안아줍니다. 이제 그 무거운 이미지와 긴장을 가볍게 흘려보낼 시간입니다.\n\n편안한 호흡과 함께 가슴과 배에 의념을 두고, 준비된 경혈 지압이나 정심주(正心呪) 호흡을 천천히 3~5회 반복해 보세요.\n내쉬는 숨마다 어두운 기운이 빠져나감을 상상합니다.\n\n마치셨다면 '완료'라고 적어주세요.` },
  { step: 9, prompt: `호흡을 마친 지금, 처음에 나를 무겁게 누르던 그 기억의 이미지(취상)와 감정은 어떻게 달라지셨나요?\n불편감 점수(0~10)는 몇 점으로 내려갔는지, 새로운 해석과 함께 나눠주세요.` }
];

let currentIdx = 0;
const recorded = {};
const chatBox = document.getElementById('chat-box');
const inputEl = document.getElementById('chat-input');

function appendMsg(text, sender) {
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${sender}`;
  const m = document.createElement('div');
  m.className = 'msg-box';
  m.innerText = text;
  wrap.appendChild(m);
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function sendMessage() {
  const text = inputEl.value.trim();
  if(!text) return;
  appendMsg(text, 'user');
  inputEl.value = '';

  recorded[geosaFlow[currentIdx].step] = text;
  currentIdx++;

  if(currentIdx < geosaFlow.length) {
    setTimeout(() => { appendMsg(geosaFlow[currentIdx].prompt, 'bot'); }, 350);
  } else {
    // 로컬스토리지에 거사 결과 보관
    localStorage.setItem('geosaData', JSON.stringify(recorded));
    setTimeout(() => { renderComplete(); }, 400);
  }
}

function renderComplete() {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap bot';
  wrap.innerHTML = `
    <div class="msg-box" style="max-width:94%;">
      <strong>🌿 거사(居邪) 세션 완료</strong>
      <div class="report-card">
        <p><strong>타깃 신념:</strong> ${topBeliefName}</p>
        <p><strong>원발사건/취상:</strong> ${recorded[3] || '-'}</p>
        <p><strong>선의적 의도:</strong> ${recorded[7] || '-'}</p>
        <p><strong>정화 후 변화:</strong> ${recorded[9] || '-'}</p>
      </div>
      <button class="btn-main" onclick="goToYangjeong()">3단계: 생기를 채우는 [양정(養正) 과정] 시작 ➔</button>
    </div>
  `;
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function goToYangjeong() {
  window.location.href = "yangjeong.html";
}

appendMsg(geosaFlow[0].prompt, 'bot');
</script>
</body>
</html>
